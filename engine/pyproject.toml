[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maatik-engine"
version = "0.1.0"
description = "maatik recognition engine: Kraken wrapper with its own CLI"
requires-python = ">=3.10,<3.15"
# Exact pins. torch/torchvision come from the PyTorch CPU index
# (https://download.pytorch.org/whl/cpu); see modal_app.py.
dependencies = [
    "kraken==7.2",
    "torch==2.14.0",
    "torchvision==0.29.1",
]

[project.optional-dependencies]
api = ["fastapi==0.165.0"]
client = ["requests==2.34.2"]
align = ["rapidfuzz==3.14.6"]
filters = ["opencv-python-headless==4.14.0.94"]
dev = ["pytest==9.0.1"]

[project.scripts]
maatik-engine = "maatik_engine.cli:main"

[tool.setuptools]
packages = ["maatik_engine"]
