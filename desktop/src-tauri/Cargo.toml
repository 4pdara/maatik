[package]
name = "maatik-desktop"
version = "0.1.0"
description = "Maatik: a desktop window for the maatik website"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
