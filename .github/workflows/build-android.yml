name: build-android

# Builds the Android app (android/) and attaches the APK to the release android-v<version>.
# Optional repository secrets for a fixed signing key (so a new version installs over the
# old one): ANDROID_KEYSTORE_B64 (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the APK is signed with a
# throwaway debug key.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Signing key (if provided)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "fixed signing key: yes"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a throwaway key. Remove the old app before installing a new version."
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          java -version
          ./gradlew assembleRelease --no-daemon
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          TAG="android-v$VERSION"
          cp android/app/build/outputs/apk/release/app-release.apk "Maatik-$VERSION.apk"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "מעתיק לאנדרואיד $VERSION" \
            --notes "אפליקציה לאנדרואיד 10 ומעלה: צילום עמודים של כתב יד והעלאה, והגהה. התקנה: מורידים את קובץ ה-APK בטלפון ומאשרים התקנה ממקור לא ידוע." || true
          gh release upload "$TAG" "Maatik-$VERSION.apk" --clobber
          ls -la "Maatik-$VERSION.apk"
