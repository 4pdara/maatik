name: build-desktop

# Builds the desktop app (desktop/, Tauri 2) for Windows and macOS and attaches the
# installers to the GitHub release desktop-v<version>. The app is a window onto the
# website (same login), so it needs no secrets.

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          node --version
          rustup show active-toolchain || rustup default stable
          cargo --version
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          TAG="desktop-v$VERSION"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "מעתיק למחשב $VERSION" \
            --notes "התוכנה למחשב: חלון לאתר של מעתיק, עם אותה כניסה. Windows: הקובץ setup.exe. Mac (מעבד Apple): הקובץ dmg." || true
          gh release upload "$TAG" ${{ matrix.files }} --clobber
          echo "uploaded to $TAG:"; ls -la ${{ matrix.files }}
